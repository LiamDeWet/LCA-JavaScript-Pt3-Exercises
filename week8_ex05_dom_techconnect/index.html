<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechConnect Developer Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="text-center mb-4">TechConnect Developer Community Hub</h1>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <input
          type="text"
          id="searchInput"
          class="form-control me-3"
          placeholder="Search by name, role or skill..."
        />

        <button id="toggleViewBtn" class="btn btn-primary">Table View</button>
      </div>

      <h5>
        Developers Displayed:
        <span id="developerCount">0</span>
      </h5>

      <hr />

      <h3>Add Developer</h3>

      <form id="developerForm" class="row g-3 mb-4">
        <div class="col-md-4">
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="Name"
          />
        </div>

        <div class="col-md-3">
          <input
            type="text"
            id="role"
            class="form-control"
            placeholder="Role"
          />
        </div>

        <div class="col-md-3">
          <input
            type="text"
            id="skills"
            class="form-control"
            placeholder="Skills (comma separated)"
          />
        </div>

        <div class="col-md-2">
          <button class="btn btn-success w-100" type="submit">
            Add Developer
          </button>
        </div>
      </form>

      <div id="formMessage"></div>

      <div id="cardView" class="row"></div>

      <div id="tableView" class="d-none">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Name</th>
              <th>Role</th>
              <th>Skills</th>
              <th>Hire Status</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
