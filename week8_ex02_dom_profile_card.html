<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Profile Card</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
      }

      #profileCard {
        width: 350px;
        margin: 0 auto;
        padding: 20px;
        border: 2px solid #333;
        border-radius: 10px;
      }

      #profileImage {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        margin-bottom: 10px;
      }

      button {
        padding: 10px;
        margin: 5px;
        cursor: pointer;
      }

      .active-status {
        background-color: lightgreen;
      }
    </style>
  </head>

  <body>
    <div id="profileCard">
      <img
        id="profileImage"
        src="https://placehold.co/100x100"
        alt="Profile Image"
      />

      <h2 id="profileName">Liam De Wet</h2>

      <p id="profileRole">Software Developer</p>

      <p id="profileBio">
        Intermediate software developer and Cybersecurity Enthusiast
      </p>

      <button id="updateNameBtn">Update Name</button>
      <button id="updateRoleBtn">Update Role</button>
      <button id="toggleStatusBtn">Toggle Active Status</button>
      <button id="changeImageBtn">Change Image</button>
      <button id="updateBioBtn">Update your Bio</button>
    </div>

    <script src="week8_ex02_dom_profile_card.js"></script>
  </body>
</html>
